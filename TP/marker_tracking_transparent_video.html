<!doctype HTML>
<html>
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('vidhandler', {
            init: function() {
                this.toggle = false;
                this.vid = document.querySelector("#vid")
                this.vid.pause()
            },
            tick: function() {
                if (this.el.object3D.visible == true) {
                    if (!this.toggle) {
                        this.toggle = true;
                        this.vid.play();
                    }
                } else {
                    this.toggle = false;
                    this.vid.pause();
                }
            }
        });
    </script>
</head>
<body style='margin : 0px; overflow: hidden;'>
    
    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>

        <a-assets>
            <video id="vid" src="./assets/videos/AlphaTestVideo.webm" loop="true" crossorigin preload='none'></video>
        </a-assets>

             <a-marker type='pattern' preset='pattern' url="./assets/markers/dino.patt" vidhandler>
            <a-plane position='0 0 0' scale="0.5 0.5 0.5" width="2" rotation="-90 0 0" material='transparent:true; opacity: 0.95; src:#vid'></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
