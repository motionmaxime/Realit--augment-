<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        AFRAME.registerComponent('vidhandler', {
            init: function() {
                this.toggle = false;
                this.vid = document.querySelector("#vid")
                this.vid.pause()
            },
            tick: function() {
                if (this.el.object3D.visible == true) {
                    if (!this.toggle) {
                        this.toggle = true;
                        this.vid.play();
                    }
                } else {
                    this.toggle = false;
                    this.vid.pause();
                }
            }
        });
    </script>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./assets/wall.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <video id="vid" src="./assets/videos/sample-mp4-file.mp4" loop="true" crossorigin preload='none'></video>
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" vidhandler>
            <a-plane position='0 0 0' scale="0.5 0.5 0.5" width="2" rotation="-90 0 0" material='transparent:true; opacity: 0.95; src:#vid'></a-plane>
        </a-entity>

        <a-camera cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable" position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>

</html>
