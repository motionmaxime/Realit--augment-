<!doctype HTML>
<html>
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Addon pour l'animation -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script>
        AFRAME.registerComponent('start-anim',
            { init: function () {
                        var el = this.el;
                        el.sceneEl.addEventListener('markerFound', function () {
                                el.setAttribute('animation-mixer', {clip: '*', loop: 'repeat'});
                                el.setAttribute('animation-mixer', {timeScale: 1});
                        });
                        el.sceneEl.addEventListener('markerLost', function () {
                                el.setAttribute('animation-mixer', {timeScale: 0});
                        });
                    }
            }
        );

    </script>
</head>

<body style='margin : 0px; overflow: hidden;'>
    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>

    <a-assets>
        <a-asset-item id="animated-asset" src="./assets/marioo.glb"></a-asset-item>
    </a-assets>

    <a-marker id="animated-marker" type='barcode' value='6'>
        <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="1 1 1" src="#animated-asset" start-anim />
    </a-marker>

    <a-entity camera></a-entity>
    </a-scene>
</body>



</html>
