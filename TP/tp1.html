<!doctype HTML>
<html>

<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
        <script>
        AFRAME.registerComponent('start-anim',
            { init: function () {
                        var el = this.el;
                        el.sceneEl.addEventListener('markerFound', function () {
                                el.setAttribute('animation-mixer', {clip: '*', loop: 'repeat'});
                                el.setAttribute('animation-mixer', {timeScale: 1});
                        });
                        el.sceneEl.addEventListener('markerLost', function () {
                                el.setAttribute('animation-mixer', {timeScale: 0});
                        });
                    }
            }
        );

    </script>
</head>


<body style='margin : 0px; overflow: hidden;'>

    <a-scene embedded
        arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>

        <a-assets>
            <a-boxe></a-boxe>
            <a-asset-item id="flash" src="./assets/flash/scene.gltf"></a-asset-item>
            <a-asset-item id="martin" src="./assets/martin/scene.gltf"></a-asset-item>
            <a-asset-item id="mario" src="./assets/marioo.glb"></a-asset-item>
        </a-assets>
        <!--0 3 6-->
        
        <a-marker id="animated-marker" type='barcode' value='0'>
            <a-gltf-model rotation="0 0 0 " position="0 1 0" scale="0.3 0.3 0.3 " src="#mario" start-anim />
        </a-marker>
        <a-marker id="marker0" type='barcode' value='0'>
            <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.3 0.3 0.3 " src="#flash" />
        </a-marker>
         <a-marker id="marker-5" type='barcode' value='5'>
            <a-gltf-model rotation="0 -60 0 " position="0 0 0" scale="0.7 0.7 0.7 " src="#martin" />
        </a-marker>
         <a-marker type='barcode' value='6'>
            <a-box position='0 0.5 0' color="green"></a-box>
        </a-marker>


        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
