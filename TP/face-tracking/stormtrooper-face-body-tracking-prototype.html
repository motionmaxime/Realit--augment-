<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Stormtrooper Holistic Rig</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;

      /* selfie / miroir */
      transform: scaleX(-1);

      z-index: 0;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
      background: transparent !important;
    }

    .a-canvas {
      background: transparent !important;
    }

    #debug-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: none;
    }

    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;

      padding: 8px 10px;
      border-radius: 8px;

      background: rgba(0, 0, 0, .68);
      color: white;

      font: 12px/1.3 system-ui, sans-serif;
      white-space: pre-line;
      pointer-events: none;
    }

    #start-button {
      display: none;

      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      z-index: 20;

      padding: 14px 18px;
      border: 0;
      border-radius: 999px;

      font: 600 15px/1 system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <video
    id="camera"
    autoplay
    muted
    playsinline
  ></video>

  <canvas id="debug-overlay"></canvas>

  <div id="status">Initialisation…</div>

  <button id="start-button" type="button">
    Activer la caméra
  </button>


  <a-scene
    embedded
    renderer="
      alpha: true;
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>

      <!--
        UN SEUL MODELE :
        casque + corps + mains + doigts + squelette.
      -->
      <a-asset-item
        id="stormtrooper-model"
        src="./assets/ue4_storm_trooper_rigged__game_ready/scene.gltf"
      ></a-asset-item>

    </a-assets>


    <a-camera
      id="camera-3d"
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>


    <a-gltf-model
      id="body-rig"
      src="#stormtrooper-model"
      visible="false"
    ></a-gltf-model>


    <a-entity
      light="type: ambient; intensity: 1.35"
    ></a-entity>

    <a-entity
      light="type: directional; intensity: 1.8"
      position="-2 4 3"
    ></a-entity>

    <a-entity
      light="type: directional; intensity: 0.8"
      position="3 1 2"
    ></a-entity>

  </a-scene>


  <script type="module">

    import {
      HolisticLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";


    // ============================================================
    // CONFIG
    // ============================================================

    const CONFIG = {

      /*
        La vidéo est affichée comme un miroir avec scaleX(-1).
        Il faut donc également retourner X dans les landmarks.
      */
      mirror: true,

      /*
        Inverse tout le rig gauche/droite pour que le personnage
        colle au mode selfie comme un vrai miroir.
      */
      mirrorWholeModel: true,

      /*
        Distance virtuelle du personnage devant la caméra Three.js.
        Le déplacement avant/arrière est simulé surtout par le scale.
      */
      bodyDepth: 3.0,

      /*
        Décalages fins si le modèle est un peu trop haut/bas.
      */
      bodyOffsetX: 0,
      bodyOffsetY: 0,
      bodyOffsetZ: 0,

      /*
        Si le modèle entier est retourné dans le mauvais sens,
        essaye 180.
      */
      modelYawOffsetDeg: 180,

      /*
        Taille globale du modèle par rapport au tracking.
        1 = taille calculée automatiquement.
        0.85 = 15 % plus petit.
      */
      modelScaleMultiplier: 0.85,

      /*
        Lissage.
        Plus petit = plus stable mais plus lent.
      */
      rootSmoothing: 0.28,
      boneSmoothing: 0.38,
      handSmoothing: 0.45,
      fingerSmoothing: 0.50,
      headSmoothing: 0.32,
      screenSmoothing: 0.36,

      /*
        Performance.
        Holistic est plus lourd que Pose uniquement.
      */
      trackingFPS: 24,

      /*
        On garde la dernière pose pendant quelques ms si
        MediaPipe perd momentanément le corps.
      */
      missingPoseHoldMs: 500,

      minPoseConfidence: 0.45,
      minHandConfidence: 0.40,
      minFaceConfidence: 0.45,

      /*
        Debug landmarks.
      */
      debug2D: false,

      /*
        Jambes.
      */
      trackLegs: false,

      /*
        Tête : utilise nose + oreilles de Pose pour orienter le casque.
      */
      trackHead: true,

      /*
        Mains et doigts.
      */
      trackHands: true,
      trackFingers: true
    };


    // ============================================================
    // LANDMARKS POSE
    // ============================================================

    const POSE = {
      NOSE: 0,

      LEFT_EAR: 7,
      RIGHT_EAR: 8,

      LEFT_SHOULDER: 11,
      RIGHT_SHOULDER: 12,

      LEFT_ELBOW: 13,
      RIGHT_ELBOW: 14,

      LEFT_WRIST: 15,
      RIGHT_WRIST: 16,

      LEFT_HIP: 23,
      RIGHT_HIP: 24,

      LEFT_KNEE: 25,
      RIGHT_KNEE: 26,

      LEFT_ANKLE: 27,
      RIGHT_ANKLE: 28
    };


    // ============================================================
    // LANDMARKS MAIN
    // ============================================================

    const HAND = {
      WRIST: 0,

      THUMB_CMC: 1,
      THUMB_MCP: 2,
      THUMB_IP: 3,
      THUMB_TIP: 4,

      INDEX_MCP: 5,
      INDEX_PIP: 6,
      INDEX_DIP: 7,
      INDEX_TIP: 8,

      MIDDLE_MCP: 9,
      MIDDLE_PIP: 10,
      MIDDLE_DIP: 11,
      MIDDLE_TIP: 12,

      RING_MCP: 13,
      RING_PIP: 14,
      RING_DIP: 15,
      RING_TIP: 16,

      PINKY_MCP: 17,
      PINKY_PIP: 18,
      PINKY_DIP: 19,
      PINKY_TIP: 20
    };


    // ============================================================
    // NOMS EXACTS DES BONES DE TON GLTF
    // ============================================================

    const BONE_NAMES = {

      root: "_rootJoint",

      pelvis: "pelvis_01",

      spine1: "spine_01_02",
      spine2: "spine_02_03",
      chest: "spine_03_04",

      clavicleL: "clavicle_l_05",
      upperArmL: "upperarm_l_06",
      lowerArmL: "lowerarm_l_07",
      handL: "hand_l_08",

      index1L: "index_01_l_09",
      index2L: "index_02_l_010",
      index3L: "index_03_l_011",

      middle1L: "middle_01_l_012",
      middle2L: "middle_02_l_013",
      middle3L: "middle_03_l_014",

      pinky1L: "pinky_01_l_015",
      pinky2L: "pinky_02_l_016",
      pinky3L: "pinky_03_l_017",

      ring1L: "ring_01_l_018",
      ring2L: "ring_02_l_019",
      ring3L: "ring_03_l_020",

      thumb1L: "thumb_01_l_021",
      thumb2L: "thumb_02_l_022",
      thumb3L: "thumb_03_l_023",

      clavicleR: "clavicle_r_026",
      upperArmR: "upperarm_r_027",
      lowerArmR: "lowerarm_r_028",
      handR: "hand_r_029",

      index1R: "index_01_r_030",
      index2R: "index_02_r_031",
      index3R: "index_03_r_032",

      middle1R: "middle_01_r_033",
      middle2R: "middle_02_r_034",
      middle3R: "middle_03_r_035",

      pinky1R: "pinky_01_r_036",
      pinky2R: "pinky_02_r_037",
      pinky3R: "pinky_03_r_038",

      ring1R: "ring_01_r_039",
      ring2R: "ring_02_r_040",
      ring3R: "ring_03_r_041",

      thumb1R: "thumb_01_r_042",
      thumb2R: "thumb_02_r_043",
      thumb3R: "thumb_03_r_044",

      neck: "neck_01_047",
      head: "head_048",

      thighL: "thigh_l_049",
      calfL: "calf_l_050",

      thighR: "thigh_r_00",
      calfR: "calf_r_055"
    };


    // ============================================================
    // DOM / THREE
    // ============================================================

    const video = document.querySelector("#camera");

    const sceneEl = document.querySelector("a-scene");
    const rigEl = document.querySelector("#body-rig");

    const statusEl = document.querySelector("#status");
    const startButton = document.querySelector("#start-button");

    const debugCanvas = document.querySelector("#debug-overlay");
    const debugCtx = debugCanvas.getContext("2d");

    const THREE = window.THREE;


    // ============================================================
    // ETAT
    // ============================================================

    let holisticLandmarker = null;

    let modelRoot = null;

    const bones = {};

    /*
      Données de repos des bones pilotés par direction.
    */
    const directionSetup = {};

    /*
      Données de repos des bones pilotés par une base complète
      (rotation 3D avec roll).
    */
    const basisSetup = {};

    let rigReady = false;
    let trackingReady = false;
    let started = false;

    let lastVideoTime = -1;
    let lastInferenceAt = 0;
    let lastPoseSeenAt = 0;

    let currentScale = null;

    const currentRootPosition = new THREE.Vector3();
    const currentRootQuaternion = new THREE.Quaternion();

    let restShoulderDistance = 1;
    let restTorsoLength = 1;

    let pelvisLocal = new THREE.Vector3();

    let restBodyBasisQuaternion = new THREE.Quaternion();

    const smoothedScreenPoints = new Map();


    // ============================================================
    // CANVAS DEBUG
    // ============================================================

    function resizeDebugCanvas() {

      const dpr = window.devicePixelRatio || 1;

      debugCanvas.width =
        Math.round(window.innerWidth * dpr);

      debugCanvas.height =
        Math.round(window.innerHeight * dpr);

      debugCanvas.style.width =
        `${window.innerWidth}px`;

      debugCanvas.style.height =
        `${window.innerHeight}px`;

      debugCtx.setTransform(
        dpr, 0, 0, dpr, 0, 0
      );
    }

    resizeDebugCanvas();

    window.addEventListener(
      "resize",
      resizeDebugCanvas
    );


    // ============================================================
    // CAMERA
    // ============================================================

    async function openCamera() {

      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error(
          "getUserMedia n'est pas disponible."
        );
      }

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio: false,

          video: {
            facingMode: "user",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          }
        });

      video.srcObject = stream;

      await new Promise((resolve) => {

        if (
          video.readyState >= 1 &&
          video.videoWidth > 0
        ) {
          resolve();
          return;
        }

        video.addEventListener(
          "loadedmetadata",
          resolve,
          { once: true }
        );
      });

      await video.play();
    }


    // ============================================================
    // HOLISTIC MEDIAPIPE
    // ============================================================

    async function createHolisticLandmarker() {

      const vision =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
        );

      return HolisticLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/holistic_landmarker/holistic_landmarker/float16/1/holistic_landmarker.task",

            delegate: "GPU"
          },

          runningMode: "VIDEO",

          minFaceDetectionConfidence:
            CONFIG.minFaceConfidence,

          minFacePresenceConfidence:
            CONFIG.minFaceConfidence,

          minPoseDetectionConfidence:
            CONFIG.minPoseConfidence,

          minPosePresenceConfidence:
            CONFIG.minPoseConfidence,

          minHandLandmarksConfidence:
            CONFIG.minHandConfidence,

          outputFaceBlendshapes: false,
          outputPoseSegmentationMasks: false
        }
      );
    }


    // ============================================================
    // UTILITAIRES VECTORIELS
    // ============================================================

    function midpointVector(a, b) {

      return a
        .clone()
        .add(b)
        .multiplyScalar(0.5);
    }


    function midpoint2D(a, b) {

      return {
        x: (a.x + b.x) * 0.5,
        y: (a.y + b.y) * 0.5
      };
    }


    function visiblePoseLandmark(lm) {

      return (
        lm &&
        (lm.visibility ?? 1) >= 0.2
      );
    }


    /*
      Convertit les world landmarks MediaPipe vers notre
      repère Three.js.

      MediaPipe :
      +X vers la droite de l'image brute
      +Y vers le bas
      Z négatif vers la caméra

      Notre scène :
      +Y vers le haut
      +Z vers la caméra

      En selfie miroir on inverse aussi X.
    */
    function mpWorldToThree(lm) {

      const x =
        CONFIG.mirror
          ? -lm.x
          : lm.x;

      return new THREE.Vector3(
        x,
        -lm.y,
        -lm.z
      );
    }


    function directionFromMP(
      from,
      to
    ) {

      return mpWorldToThree(to)
        .sub(
          mpWorldToThree(from)
        )
        .normalize();
    }


    /*
      Crée une base orthonormale à partir d'un axe "right"
      et d'un axe "up".

      Z = right × up
    */
    function quaternionFromRightUp(
      rightInput,
      upInput
    ) {

      const right =
        rightInput.clone().normalize();

      let up =
        upInput.clone();

      /*
        Gram-Schmidt :
        on retire à up sa composante sur right.
      */
      up.sub(
        right
          .clone()
          .multiplyScalar(
            up.dot(right)
          )
      );

      if (up.lengthSq() < 1e-8) {
        return null;
      }

      up.normalize();

      const forward =
        right
          .clone()
          .cross(up)
          .normalize();

      /*
        Recalcule Y pour une base parfaitement orthogonale.
      */
      up.copy(
        forward
          .clone()
          .cross(right)
          .normalize()
      );

      const matrix =
        new THREE.Matrix4()
          .makeBasis(
            right,
            up,
            forward
          );

      return new THREE.Quaternion()
        .setFromRotationMatrix(matrix);
    }


    /*
      Base d'une paume.

      X = pinky -> index
      Y = wrist -> middle MCP
      Z = normale de la paume
    */
    function quaternionFromPalm(
      wrist,
      indexMCP,
      middleMCP,
      pinkyMCP
    ) {

      const w = mpWorldToThree(wrist);
      const i = mpWorldToThree(indexMCP);
      const m = mpWorldToThree(middleMCP);
      const p = mpWorldToThree(pinkyMCP);

      const side =
        i.clone()
          .sub(p)
          .normalize();

      let forward =
        m.clone()
          .sub(w);

      forward.sub(
        side
          .clone()
          .multiplyScalar(
            forward.dot(side)
          )
      );

      if (forward.lengthSq() < 1e-8) {
        return null;
      }

      forward.normalize();

      const normal =
        side
          .clone()
          .cross(forward)
          .normalize();

      /*
        makeBasis attend X/Y/Z.
        Ici :
        X = côté de la paume
        Y = direction vers les doigts
        Z = normale
      */
      const matrix =
        new THREE.Matrix4()
          .makeBasis(
            side,
            forward,
            normal
          );

      return new THREE.Quaternion()
        .setFromRotationMatrix(matrix);
    }


    // ============================================================
    // SCREEN / WORLD
    // ============================================================

    function landmarkToScreen(lm) {

      const screenW =
        window.innerWidth;

      const screenH =
        window.innerHeight;

      const videoW =
        video.videoWidth;

      const videoH =
        video.videoHeight;

      /*
        Même logique que object-fit: cover.
      */
      const coverScale =
        Math.max(
          screenW / videoW,
          screenH / videoH
        );

      const displayedW =
        videoW * coverScale;

      const displayedH =
        videoH * coverScale;

      const cropX =
        (screenW - displayedW) * 0.5;

      const cropY =
        (screenH - displayedH) * 0.5;

      let x = lm.x;

      if (CONFIG.mirror) {
        x = 1 - x;
      }

      return {
        x:
          x * displayedW +
          cropX,

        y:
          lm.y * displayedH +
          cropY,

        visibility:
          lm.visibility ?? 1
      };
    }


    function smoothScreenPoint(
      key,
      point
    ) {

      const previous =
        smoothedScreenPoints.get(key);

      if (!previous) {

        const first = {
          ...point
        };

        smoothedScreenPoints.set(
          key,
          first
        );

        return first;
      }

      const s =
        CONFIG.screenSmoothing;

      const result = {

        x:
          THREE.MathUtils.lerp(
            previous.x,
            point.x,
            s
          ),

        y:
          THREE.MathUtils.lerp(
            previous.y,
            point.y,
            s
          ),

        visibility:
          point.visibility
      };

      smoothedScreenPoints.set(
        key,
        result
      );

      return result;
    }


    function screenToWorld(
      point,
      depth = CONFIG.bodyDepth
    ) {

      const camera =
        sceneEl.camera;

      const ndc =
        new THREE.Vector2(
          (point.x / window.innerWidth) * 2 - 1,
          -(point.y / window.innerHeight) * 2 + 1
        );

      const raycaster =
        new THREE.Raycaster();

      raycaster.setFromCamera(
        ndc,
        camera
      );

      const cameraPosition =
        new THREE.Vector3();

      const cameraForward =
        new THREE.Vector3();

      camera.getWorldPosition(
        cameraPosition
      );

      camera.getWorldDirection(
        cameraForward
      );

      const denominator =
        raycaster.ray.direction.dot(
          cameraForward
        );

      const t =
        depth /
        Math.max(
          0.0001,
          denominator
        );

      return cameraPosition
        .clone()
        .add(
          raycaster.ray.direction
            .clone()
            .multiplyScalar(t)
        );
    }


    // ============================================================
    // RIG : OUTILS
    // ============================================================

    function findBone(name) {

      const bone =
        modelRoot.getObjectByName(name);

      if (!bone) {
        console.warn(
          "Bone introuvable :",
          name
        );
      }

      return bone;
    }


    function getWorldPosition(object) {

      const position =
        new THREE.Vector3();

      object.getWorldPosition(
        position
      );

      return position;
    }


    function getPointInRigLocal(object) {

      const world =
        getWorldPosition(object);

      return rigEl.object3D
        .worldToLocal(world);
    }


    /*
      Enregistre l'axe principal d'un bone grâce à son enfant.
    */
    function registerDirectionBone(
      key,
      childKey
    ) {

      const bone =
        bones[key];

      const child =
        bones[childKey];

      if (!bone || !child) {
        return;
      }

      directionSetup[key] = {

        bone,

        /*
          child.position est déjà dans le repère local du bone.
        */
        restAxis:
          child.position
            .clone()
            .normalize(),

        restQuaternion:
          bone.quaternion.clone()
      };
    }


    /*
      Pour la dernière phalange : elle n'a pas de bone enfant.
      On approxime son axe avec l'axe venant de son parent.
    */
    function registerTerminalBone(key) {

      const bone =
        bones[key];

      if (!bone) {
        return;
      }

      let restAxis =
        bone.position
          .clone()
          .normalize();

      restAxis.applyQuaternion(
        bone.quaternion
          .clone()
          .invert()
      );

      restAxis.normalize();

      directionSetup[key] = {
        bone,
        restAxis,
        restQuaternion:
          bone.quaternion.clone()
      };
    }


    /*
      Enregistre un bone piloté par une base 3D complète.
      On stocke l'écart entre la base géométrique et la vraie
      orientation du bone dans le GLTF.
    */
    function registerBasisBone(
      key,
      restBasisQuaternion
    ) {

      const bone =
        bones[key];

      if (!bone) {
        return;
      }

      const boneWorldQuaternion =
        new THREE.Quaternion();

      bone.getWorldQuaternion(
        boneWorldQuaternion
      );

      basisSetup[key] = {

        bone,

        basisToBoneOffset:
          restBasisQuaternion
            .clone()
            .invert()
            .multiply(
              boneWorldQuaternion
            )
      };
    }


    function setBoneWorldQuaternion(
      key,
      targetWorldQuaternion,
      smoothing
    ) {

      const setup =
        basisSetup[key];

      if (!setup) {
        return;
      }

      const bone =
        setup.bone;

      const desiredBoneWorld =
        targetWorldQuaternion
          .clone()
          .multiply(
            setup.basisToBoneOffset
          );

      bone.parent.updateWorldMatrix(
        true,
        false
      );

      const parentWorldQuaternion =
        new THREE.Quaternion();

      bone.parent.getWorldQuaternion(
        parentWorldQuaternion
      );

      const desiredLocal =
        parentWorldQuaternion
          .invert()
          .multiply(
            desiredBoneWorld
          );

      bone.quaternion.slerp(
        desiredLocal,
        smoothing
      );

      bone.updateMatrixWorld(true);
    }


    // ============================================================
    // INITIALISATION DU RIG
    // ============================================================

    function initialiseRig() {

      modelRoot =
        rigEl.getObject3D("mesh");

      if (!modelRoot) {

        statusEl.textContent =
          "Impossible de lire le GLTF.";

        return;
      }


      rigEl.object3D.position.set(
        0, 0, 0
      );

      rigEl.object3D.quaternion.identity();

      rigEl.object3D.scale.setScalar(1);


      modelRoot.traverse(
        (object) => {

          if (
            object.isMesh ||
            object.isSkinnedMesh
          ) {
            object.frustumCulled = false;
          }
        }
      );


      for (
        const [key, name]
        of Object.entries(BONE_NAMES)
      ) {

        bones[key] =
          findBone(name);
      }


      const required = [
        "pelvis",
        "chest",

        "upperArmL",
        "lowerArmL",
        "handL",

        "upperArmR",
        "lowerArmR",
        "handR",

        "neck",
        "head"
      ];


      const missing =
        required.filter(
          key => !bones[key]
        );


      if (missing.length > 0) {

        statusEl.textContent =
          "Bones manquants : " +
          missing.join(", ");

        return;
      }


      modelRoot.updateMatrixWorld(true);


      // ----------------------------------------------------------
      // BASE DE REPOS DU CORPS
      // ----------------------------------------------------------

      const restShoulderL =
        getPointInRigLocal(
          bones.upperArmL
        );

      const restShoulderR =
        getPointInRigLocal(
          bones.upperArmR
        );

      const restChest =
        getPointInRigLocal(
          bones.chest
        );

      const restPelvis =
        getPointInRigLocal(
          bones.pelvis
        );


      const restRight =
        restShoulderR
          .clone()
          .sub(restShoulderL);


      const restUp =
        restChest
          .clone()
          .sub(restPelvis);


      restBodyBasisQuaternion =
        quaternionFromRightUp(
          restRight,
          restUp
        ) ||
        new THREE.Quaternion();


      restShoulderDistance =
        restShoulderL.distanceTo(
          restShoulderR
        );


      restTorsoLength =
        restChest.distanceTo(
          restPelvis
        );


      pelvisLocal =
        restPelvis.clone();


      // ----------------------------------------------------------
      // BRAS
      // ----------------------------------------------------------

      registerDirectionBone(
        "upperArmL",
        "lowerArmL"
      );

      registerDirectionBone(
        "lowerArmL",
        "handL"
      );

      registerDirectionBone(
        "upperArmR",
        "lowerArmR"
      );

      registerDirectionBone(
        "lowerArmR",
        "handR"
      );


      // ----------------------------------------------------------
      // MAINS : base géométrique de repos
      // ----------------------------------------------------------

      const registerHandBasis =
        (
          handKey,
          indexKey,
          middleKey,
          pinkyKey
        ) => {

          const hand =
            bones[handKey];

          const index =
            bones[indexKey];

          const middle =
            bones[middleKey];

          const pinky =
            bones[pinkyKey];

          if (
            !hand ||
            !index ||
            !middle ||
            !pinky
          ) {
            return;
          }

          const wrist =
            getWorldPosition(hand);

          const indexPos =
            getWorldPosition(index);

          const middlePos =
            getWorldPosition(middle);

          const pinkyPos =
            getWorldPosition(pinky);


          const side =
            indexPos
              .clone()
              .sub(pinkyPos)
              .normalize();


          let forward =
            middlePos
              .clone()
              .sub(wrist);


          forward.sub(
            side
              .clone()
              .multiplyScalar(
                forward.dot(side)
              )
          );


          forward.normalize();


          const normal =
            side
              .clone()
              .cross(forward)
              .normalize();


          const restPalmMatrix =
            new THREE.Matrix4()
              .makeBasis(
                side,
                forward,
                normal
              );


          const restPalmQuaternion =
            new THREE.Quaternion()
              .setFromRotationMatrix(
                restPalmMatrix
              );


          registerBasisBone(
            handKey,
            restPalmQuaternion
          );
        };


      registerHandBasis(
        "handL",
        "index1L",
        "middle1L",
        "pinky1L"
      );

      registerHandBasis(
        "handR",
        "index1R",
        "middle1R",
        "pinky1R"
      );


      // ----------------------------------------------------------
      // DOIGTS
      // ----------------------------------------------------------

      const registerFinger =
        (a, b, c) => {

          registerDirectionBone(
            a,
            b
          );

          registerDirectionBone(
            b,
            c
          );

          registerTerminalBone(c);
        };


      registerFinger(
        "thumb1L",
        "thumb2L",
        "thumb3L"
      );

      registerFinger(
        "index1L",
        "index2L",
        "index3L"
      );

      registerFinger(
        "middle1L",
        "middle2L",
        "middle3L"
      );

      registerFinger(
        "ring1L",
        "ring2L",
        "ring3L"
      );

      registerFinger(
        "pinky1L",
        "pinky2L",
        "pinky3L"
      );


      registerFinger(
        "thumb1R",
        "thumb2R",
        "thumb3R"
      );

      registerFinger(
        "index1R",
        "index2R",
        "index3R"
      );

      registerFinger(
        "middle1R",
        "middle2R",
        "middle3R"
      );

      registerFinger(
        "ring1R",
        "ring2R",
        "ring3R"
      );

      registerFinger(
        "pinky1R",
        "pinky2R",
        "pinky3R"
      );


      // ----------------------------------------------------------
      // TETE
      // ----------------------------------------------------------

      /*
        En pose neutre, la tête regarde dans la même base générale
        que le corps. On conserve l'offset exact du bone.
      */
      registerBasisBone(
        "neck",
        restBodyBasisQuaternion
      );

      registerBasisBone(
        "head",
        restBodyBasisQuaternion
      );


      // ----------------------------------------------------------
      // JAMBES
      // ----------------------------------------------------------

      if (CONFIG.trackLegs) {

        registerDirectionBone(
          "thighL",
          "calfL"
        );

        registerDirectionBone(
          "thighR",
          "calfR"
        );
      }


      rigReady = true;

      statusEl.textContent =
        "Rig chargé — attente MediaPipe…";

      console.log(
        "Rig prêt",
        {
          bones,
          restShoulderDistance,
          restTorsoLength,
          pelvisLocal,
          restBodyBasisQuaternion
        }
      );
    }


    rigEl.addEventListener(
      "model-loaded",
      initialiseRig
    );


    // ============================================================
    // PILOTAGE DIRECTIONNEL D'UN BONE
    // ============================================================

    function driveBoneDirection(
      key,
      targetWorldDirection,
      smoothing
    ) {

      const setup =
        directionSetup[key];

      if (!setup) {
        return;
      }

      const bone =
        setup.bone;


      bone.parent.updateWorldMatrix(
        true,
        false
      );


      const parentWorldQuaternion =
        new THREE.Quaternion();

      bone.parent.getWorldQuaternion(
        parentWorldQuaternion
      );


      const targetDirectionInParent =
        targetWorldDirection
          .clone()
          .applyQuaternion(
            parentWorldQuaternion
              .clone()
              .invert()
          )
          .normalize();


      const restDirectionInParent =
        setup.restAxis
          .clone()
          .applyQuaternion(
            setup.restQuaternion
          )
          .normalize();


      const deltaQuaternion =
        new THREE.Quaternion()
          .setFromUnitVectors(
            restDirectionInParent,
            targetDirectionInParent
          );


      const desiredLocal =
        deltaQuaternion
          .multiply(
            setup.restQuaternion
              .clone()
          );


      bone.quaternion.slerp(
        desiredLocal,
        smoothing
      );


      bone.updateMatrixWorld(true);
    }


    function driveBoneFromMP(
      key,
      from,
      to,
      smoothing
    ) {

      if (!from || !to) {
        return;
      }

      const direction =
        directionFromMP(
          from,
          to
        );

      driveBoneDirection(
        key,
        direction,
        smoothing
      );
    }


    // ============================================================
    // ROTATION DU CORPS ENTIER
    // ============================================================

    function getBodyTargetQuaternion(
      poseWorld
    ) {

      const shoulderL =
        mpWorldToThree(
          poseWorld[
            POSE.LEFT_SHOULDER
          ]
        );

      const shoulderR =
        mpWorldToThree(
          poseWorld[
            POSE.RIGHT_SHOULDER
          ]
        );


      const hipL =
        mpWorldToThree(
          poseWorld[
            POSE.LEFT_HIP
          ]
        );

      const hipR =
        mpWorldToThree(
          poseWorld[
            POSE.RIGHT_HIP
          ]
        );


      const shoulderCenter =
        midpointVector(
          shoulderL,
          shoulderR
        );


      const hipCenter =
        midpointVector(
          hipL,
          hipR
        );


      const targetRight =
        shoulderR
          .clone()
          .sub(shoulderL);


      const targetUp =
        shoulderCenter
          .clone()
          .sub(hipCenter);


      const targetBodyBasis =
        quaternionFromRightUp(
          targetRight,
          targetUp
        );


      if (!targetBodyBasis) {
        return null;
      }


      /*
        Rotation qui transforme la base du modèle au repos
        en base du corps détecté.
      */
      const delta =
        targetBodyBasis
          .clone()
          .multiply(
            restBodyBasisQuaternion
              .clone()
              .invert()
          );


      const manualYaw =
        new THREE.Quaternion()
          .setFromEuler(
            new THREE.Euler(
              0,
              THREE.MathUtils.degToRad(
                CONFIG.modelYawOffsetDeg
              ),
              0
            )
          );


      return delta.multiply(
        manualYaw
      );
    }


    // ============================================================
    // POSITION + SCALE + ROTATION DU ROOT
    // ============================================================

    function updateRigRoot(
      poseLandmarks,
      poseWorld
    ) {

      const required = [
        POSE.LEFT_SHOULDER,
        POSE.RIGHT_SHOULDER,
        POSE.LEFT_HIP,
        POSE.RIGHT_HIP
      ];


      for (const index of required) {

        if (
          !visiblePoseLandmark(
            poseLandmarks[index]
          )
        ) {
          return null;
        }
      }


      // ----------------------------------------------------------
      // ROTATION 3D COMPLETE
      // ----------------------------------------------------------

      const targetRootQuaternion =
        getBodyTargetQuaternion(
          poseWorld
        );


      if (!targetRootQuaternion) {
        return null;
      }


      if (!rigEl.object3D.visible) {

        currentRootQuaternion.copy(
          targetRootQuaternion
        );

      } else {

        currentRootQuaternion.slerp(
          targetRootQuaternion,
          CONFIG.rootSmoothing
        );
      }


      // ----------------------------------------------------------
      // LANDMARKS ECRAN LISSES
      // ----------------------------------------------------------

      const p = {};


      for (const index of required) {

        p[index] =
          smoothScreenPoint(
            "pose-" + index,
            landmarkToScreen(
              poseLandmarks[index]
            )
          );
      }


      const shoulderCenterScreen =
        midpoint2D(
          p[POSE.LEFT_SHOULDER],
          p[POSE.RIGHT_SHOULDER]
        );


      const hipCenterScreen =
        midpoint2D(
          p[POSE.LEFT_HIP],
          p[POSE.RIGHT_HIP]
        );


      const shoulderLWorld =
        screenToWorld(
          p[POSE.LEFT_SHOULDER]
        );


      const shoulderRWorld =
        screenToWorld(
          p[POSE.RIGHT_SHOULDER]
        );


      const shoulderCenterWorld =
        screenToWorld(
          shoulderCenterScreen
        );


      const hipCenterWorld =
        screenToWorld(
          hipCenterScreen
        );


      // ----------------------------------------------------------
      // SCALE
      // ----------------------------------------------------------

      /*
        Shoulder width seule rétrécit quand tu te mets de profil.
        Torso height reste beaucoup plus stable.

        On mélange donc les deux, avec priorité au torse.
      */

      const scaleByShoulders =
        shoulderLWorld
          .distanceTo(
            shoulderRWorld
          ) /
        Math.max(
          restShoulderDistance,
          0.0001
        );


      const scaleByTorso =
        shoulderCenterWorld
          .distanceTo(
            hipCenterWorld
          ) /
        Math.max(
          restTorsoLength,
          0.0001
        );


      const targetScale =
        (
          scaleByTorso * 0.78 +
          scaleByShoulders * 0.22
        ) * CONFIG.modelScaleMultiplier;


      if (currentScale === null) {

        currentScale =
          targetScale;

      } else {

        currentScale =
          THREE.MathUtils.lerp(
            currentScale,
            targetScale,
            CONFIG.rootSmoothing
          );
      }


      // ----------------------------------------------------------
      // POSITION
      // ----------------------------------------------------------

      /*
        On place le pelvis du modèle exactement sur le pelvis
        détecté à l'écran.
      */

      const pelvisOffset =
        pelvisLocal
          .clone()
          .multiplyScalar(
            currentScale
          )
          .applyQuaternion(
            currentRootQuaternion
          );


      const wantedRootPosition =
        hipCenterWorld
          .clone()
          .sub(
            pelvisOffset
          );


      wantedRootPosition.x +=
        CONFIG.bodyOffsetX;

      wantedRootPosition.y +=
        CONFIG.bodyOffsetY;

      wantedRootPosition.z +=
        CONFIG.bodyOffsetZ;


      if (!rigEl.object3D.visible) {

        currentRootPosition.copy(
          wantedRootPosition
        );

      } else {

        currentRootPosition.lerp(
          wantedRootPosition,
          CONFIG.rootSmoothing
        );
      }


      rigEl.object3D.position.copy(
        currentRootPosition
      );


      rigEl.object3D.quaternion.copy(
        currentRootQuaternion
      );


      rigEl.object3D.scale.setScalar(
        currentScale
      );


      rigEl.object3D.visible = true;


      return targetRootQuaternion;
    }


    // ============================================================
    // BRAS
    // ============================================================

    function updateArms(
      poseLandmarks,
      poseWorld
    ) {

      const required = [
        POSE.LEFT_SHOULDER,
        POSE.RIGHT_SHOULDER,
        POSE.LEFT_ELBOW,
        POSE.RIGHT_ELBOW,
        POSE.LEFT_WRIST,
        POSE.RIGHT_WRIST
      ];


      for (const index of required) {

        if (!poseWorld[index]) {
          return;
        }
      }


      if (CONFIG.mirrorWholeModel) {

        /*
          On inverse tout le rig :
          côté visible à gauche de l'écran -> bones droits,
          côté visible à droite de l'écran -> bones gauches.
        */

        driveBoneFromMP(
          "upperArmL",
          poseWorld[
            POSE.RIGHT_SHOULDER
          ],
          poseWorld[
            POSE.RIGHT_ELBOW
          ],
          CONFIG.boneSmoothing
        );

        driveBoneFromMP(
          "lowerArmL",
          poseWorld[
            POSE.RIGHT_ELBOW
          ],
          poseWorld[
            POSE.RIGHT_WRIST
          ],
          CONFIG.boneSmoothing
        );

        driveBoneFromMP(
          "upperArmR",
          poseWorld[
            POSE.LEFT_SHOULDER
          ],
          poseWorld[
            POSE.LEFT_ELBOW
          ],
          CONFIG.boneSmoothing
        );

        driveBoneFromMP(
          "lowerArmR",
          poseWorld[
            POSE.LEFT_ELBOW
          ],
          poseWorld[
            POSE.LEFT_WRIST
          ],
          CONFIG.boneSmoothing
        );

      } else {

        driveBoneFromMP(
          "upperArmL",
          poseWorld[
            POSE.LEFT_SHOULDER
          ],
          poseWorld[
            POSE.LEFT_ELBOW
          ],
          CONFIG.boneSmoothing
        );

        driveBoneFromMP(
          "lowerArmL",
          poseWorld[
            POSE.LEFT_ELBOW
          ],
          poseWorld[
            POSE.LEFT_WRIST
          ],
          CONFIG.boneSmoothing
        );

        driveBoneFromMP(
          "upperArmR",
          poseWorld[
            POSE.RIGHT_SHOULDER
          ],
          poseWorld[
            POSE.RIGHT_ELBOW
          ],
          CONFIG.boneSmoothing
        );

        driveBoneFromMP(
          "lowerArmR",
          poseWorld[
            POSE.RIGHT_ELBOW
          ],
          poseWorld[
            POSE.RIGHT_WRIST
          ],
          CONFIG.boneSmoothing
        );
      }
    }


    // ============================================================
    // TETE / CASQUE
    // ============================================================

    function getFaceTargetQuaternion(
      poseWorld
    ) {

      const nose =
        poseWorld[
          POSE.NOSE
        ];

      const leftEar =
        poseWorld[
          POSE.LEFT_EAR
        ];

      const rightEar =
        poseWorld[
          POSE.RIGHT_EAR
        ];


      if (
        !nose ||
        !leftEar ||
        !rightEar
      ) {
        return null;
      }


      const n =
        mpWorldToThree(nose);

      const l =
        mpWorldToThree(leftEar);

      const r =
        mpWorldToThree(rightEar);


      const earCenter =
        midpointVector(
          l,
          r
        );


      const right =
        r.clone()
          .sub(l)
          .normalize();


      let forward =
        n.clone()
          .sub(earCenter);


      /*
        Retire la composante latérale.
      */
      forward.sub(
        right
          .clone()
          .multiplyScalar(
            forward.dot(right)
          )
      );


      if (forward.lengthSq() < 1e-8) {
        return null;
      }


      forward.normalize();


      /*
        Avec :
        right = X
        forward = Z

        Y = Z × X
      */
      const up =
        forward
          .clone()
          .cross(right)
          .normalize();


      const matrix =
        new THREE.Matrix4()
          .makeBasis(
            right,
            up,
            forward
          );


      return new THREE.Quaternion()
        .setFromRotationMatrix(
          matrix
        );
    }


    function updateHead(
      poseWorld,
      bodyTargetQuaternion
    ) {

      if (
        !CONFIG.trackHead ||
        !bodyTargetQuaternion
      ) {
        return;
      }


      const faceQuaternion =
        getFaceTargetQuaternion(
          poseWorld
        );


      if (!faceQuaternion) {
        return;
      }


      /*
        Le cou prend une partie du mouvement.
      */
      const neckQuaternion =
        bodyTargetQuaternion
          .clone()
          .slerp(
            faceQuaternion,
            0.42
          );


      setBoneWorldQuaternion(
        "neck",
        neckQuaternion,
        CONFIG.headSmoothing
      );


      /*
        Le head bone prend toute l'orientation détectée.
        Le casque étant dans le même mesh riggé,
        il suit automatiquement.
      */
      setBoneWorldQuaternion(
        "head",
        faceQuaternion,
        CONFIG.headSmoothing
      );
    }


    // ============================================================
    // MAIN + WRIST
    // ============================================================

    function updateHandBone(
      side,
      handWorld
    ) {

      if (
        !CONFIG.trackHands ||
        !handWorld ||
        handWorld.length < 21
      ) {
        return;
      }


      const palmQuaternion =
        quaternionFromPalm(

          handWorld[
            HAND.WRIST
          ],

          handWorld[
            HAND.INDEX_MCP
          ],

          handWorld[
            HAND.MIDDLE_MCP
          ],

          handWorld[
            HAND.PINKY_MCP
          ]
        );


      if (!palmQuaternion) {
        return;
      }


      setBoneWorldQuaternion(
        side === "L"
          ? "handL"
          : "handR",

        palmQuaternion,

        CONFIG.handSmoothing
      );
    }


    // ============================================================
    // DOIGTS
    // ============================================================

    function updateFingerChainSide(
      finger,
      side,
      handWorld,
      a,
      b,
      c,
      tip
    ) {

      driveBoneFromMP(
        finger + "1" + side,
        handWorld[a],
        handWorld[b],
        CONFIG.fingerSmoothing
      );


      driveBoneFromMP(
        finger + "2" + side,
        handWorld[b],
        handWorld[c],
        CONFIG.fingerSmoothing
      );


      driveBoneFromMP(
        finger + "3" + side,
        handWorld[c],
        handWorld[tip],
        CONFIG.fingerSmoothing
      );
    }


    function updateAllFingers(
      side,
      handWorld
    ) {

      if (
        !CONFIG.trackFingers ||
        !handWorld ||
        handWorld.length < 21
      ) {
        return;
      }


      updateFingerChainSide(
        "thumb",
        side,
        handWorld,

        HAND.THUMB_CMC,
        HAND.THUMB_MCP,
        HAND.THUMB_IP,
        HAND.THUMB_TIP
      );


      updateFingerChainSide(
        "index",
        side,
        handWorld,

        HAND.INDEX_MCP,
        HAND.INDEX_PIP,
        HAND.INDEX_DIP,
        HAND.INDEX_TIP
      );


      updateFingerChainSide(
        "middle",
        side,
        handWorld,

        HAND.MIDDLE_MCP,
        HAND.MIDDLE_PIP,
        HAND.MIDDLE_DIP,
        HAND.MIDDLE_TIP
      );


      updateFingerChainSide(
        "ring",
        side,
        handWorld,

        HAND.RING_MCP,
        HAND.RING_PIP,
        HAND.RING_DIP,
        HAND.RING_TIP
      );


      updateFingerChainSide(
        "pinky",
        side,
        handWorld,

        HAND.PINKY_MCP,
        HAND.PINKY_PIP,
        HAND.PINKY_DIP,
        HAND.PINKY_TIP
      );
    }

    function updateLegs(

          ],

          ],

        );

    // ============================================================
    // DEBUG
    // ============================================================

    function drawDebug(
      poseLandmarks,
      leftHandLandmarks,
      rightHandLandmarks
    ) {

      if (!CONFIG.debug2D) {
        return;
      }


      const drawPoint =
        (lm, radius, fill) => {

          if (!lm) {
            return;
          }

          const p =
            landmarkToScreen(lm);

          debugCtx.beginPath();

          debugCtx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI * 2
          );

          debugCtx.fillStyle =
            fill;

          debugCtx.fill();
        };


      for (
        const index
        of Object.values(POSE)
      ) {

        drawPoint(
          poseLandmarks[index],
          4,
          "white"
        );
      }


      if (leftHandLandmarks) {

        for (
          const lm
          of leftHandLandmarks
        ) {
          drawPoint(
            lm,
            3,
            "#00ff9d"
          );
        }
      }


      if (rightHandLandmarks) {

        for (
          const lm
          of rightHandLandmarks
        ) {
          drawPoint(
            lm,
            3,
            "#ff9d00"
          );
        }
      }
    }


    // ============================================================
    // UPDATE COMPLET
    // ============================================================

    function updateRig(result) {

      const poseLandmarks =
        result.poseLandmarks?.[0];

      const poseWorld =
        result.poseWorldLandmarks?.[0];


      if (
        !poseLandmarks ||
        !poseWorld
      ) {
        return false;
      }


      const bodyTargetQuaternion =
        updateRigRoot(
          poseLandmarks,
          poseWorld
        );


      if (!bodyTargetQuaternion) {
        return false;
      }


      updateArms(
        poseLandmarks,
        poseWorld
      );


      updateHead(
        poseWorld,
        bodyTargetQuaternion
      );


      const leftHandLandmarks =
        result.leftHandLandmarks?.[0];

      const leftHandWorld =
        result.leftHandWorldLandmarks?.[0];


      const rightHandLandmarks =
        result.rightHandLandmarks?.[0];

      const rightHandWorld =
        result.rightHandWorldLandmarks?.[0];


      /*
        Les résultats Holistic donnent directement :
        left hand et right hand.

        On mappe donc :
        main gauche -> handL
        main droite -> handR.
      */
      if (CONFIG.mirrorWholeModel) {

        if (leftHandWorld) {

          updateHandBone(
            "R",
            leftHandWorld
          );

          updateAllFingers(
            "R",
            leftHandWorld
          );
        }


        if (rightHandWorld) {

          updateHandBone(
            "L",
            rightHandWorld
          );

          updateAllFingers(
            "L",
            rightHandWorld
          );
        }

      } else {

        if (leftHandWorld) {

          updateHandBone(
            "L",
            leftHandWorld
          );

          updateAllFingers(
            "L",
            leftHandWorld
          );
        }


        if (rightHandWorld) {

          updateHandBone(
            "R",
            rightHandWorld
          );

          updateAllFingers(
            "R",
            rightHandWorld
          );
        }
      }


      updateLegs(
        poseWorld
      );


      drawDebug(
        poseLandmarks,
        leftHandLandmarks,
        rightHandLandmarks
      );


      return true;
    }


    // ============================================================
    // LOOP
    // ============================================================

    function loop(timestamp) {

      debugCtx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );


      if (
        holisticLandmarker &&
        rigReady &&
        trackingReady &&
        video.readyState >= 2
      ) {

        const interval =
          1000 /
          CONFIG.trackingFPS;


        if (
          video.currentTime !==
            lastVideoTime &&
          timestamp -
            lastInferenceAt >=
            interval
        ) {

          lastVideoTime =
            video.currentTime;

          lastInferenceAt =
            timestamp;


          const result =
            holisticLandmarker
              .detectForVideo(
                video,
                performance.now()
              );


          const updated =
            updateRig(result);


          if (updated) {

            lastPoseSeenAt =
              performance.now();

            const handCount =
              Number(
                !!result
                  .leftHandWorldLandmarks
                  ?.[0]
              ) +
              Number(
                !!result
                  .rightHandWorldLandmarks
                  ?.[0]
              );


            statusEl.textContent =
              `Holistic actif • corps + tête • ${handCount}/2 main(s)`;

          } else {

            const missingFor =
              performance.now() -
              lastPoseSeenAt;


            if (
              missingFor >
              CONFIG.missingPoseHoldMs
            ) {

              rigEl.object3D.visible =
                false;

              statusEl.textContent =
                "Pose perdue";
            }
          }
        }
      }


      requestAnimationFrame(loop);
    }


    // ============================================================
    // START
    // ============================================================

    async function start() {

      if (started) {
        return;
      }

      started = true;

      startButton.style.display =
        "none";


      try {

        statusEl.textContent =
          "Ouverture caméra…";


        const holisticPromise =
          createHolisticLandmarker();


        await openCamera();


        statusEl.textContent =
          "Chargement Holistic…";


        holisticLandmarker =
          await holisticPromise;


        trackingReady = true;


        statusEl.textContent =
          "Holistic prêt — attente du rig…";


        requestAnimationFrame(loop);


      } catch (error) {

        console.error(error);

        started = false;


        let message =
          error?.message ||
          String(error);


        if (!window.isSecureContext) {

          message =
            "La caméra nécessite HTTPS ou localhost.";
        }


        statusEl.textContent =
          "Erreur : " +
          message;


        startButton.style.display =
          "block";
      }
    }


    startButton.addEventListener(
      "click",
      start
    );


    /*
      Lancement automatique.
      Le bouton sert de fallback si Safari/iOS exige un clic.
    */
    start();

  </script>
