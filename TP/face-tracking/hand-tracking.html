<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hand Tracking - Finger to Finger</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      background: #000;
    }

    #overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,.65);
      color: white;
      font: 12px/1.2 system-ui, sans-serif;
      z-index: 10;
    }

    #startButton {
      display: none;
      position: fixed;
      z-index: 20;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font: 600 15px system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>

  <div id="status">Chargement…</div>

  <button id="startButton">
    Activer la caméra
  </button>

  <script type="module">

    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";


    // ============================================================
    // CONFIG
    // ============================================================

    const CONFIG = {
      maxHands: 2,
      mirror: true,

      lineWidth: 14,
      pointRadius: 9,

      smoothing: 0.50,
      trackingFPS: 30,

      /*
        Garde les dernières lignes visibles si MediaPipe
        perd brièvement une main.
      */
      holdLastDetectionMs: 700
    };


    // ============================================================
    // COULEURS
    // ============================================================

    const COLORS = {
      thumb: "#ff1744",   // rouge néon
      index: "#ffea00",   // jaune électrique
      middle: "#00ff66",  // vert néon
      ring: "#00b7ff",    // bleu cyan
      pinky: "#d500f9"    // violet néon
    };


    // ============================================================
    // FINGERTIPS MEDIAPIPE
    // ============================================================

    const TIPS = {
      thumb: 4,
      index: 8,
      middle: 12,
      ring: 16,
      pinky: 20
    };


    // ============================================================
    // DOM
    // ============================================================

    const video = document.querySelector("#camera");
    const canvas = document.querySelector("#overlay");
    const ctx = canvas.getContext("2d");

    const statusEl = document.querySelector("#status");
    const startButton = document.querySelector("#startButton");


    // ============================================================
    // ETAT
    // ============================================================

    let handLandmarker = null;

    let started = false;
    let lastVideoTime = -1;
    let lastTrackingTime = 0;

    /*
      Dernières connexions valides.
      On les conserve entre deux inférences MediaPipe
      pour éviter le flicker.
    */
    let lastConnections = null;
    let lastValidDetectionTime = 0;

    /*
      Lissage séparé par côté + landmark.
    */
    const smoothPoints = {
      Left: new Map(),
      Right: new Map()
    };


    // ============================================================
    // CANVAS
    // ============================================================

    function resizeCanvas() {

      const dpr = window.devicePixelRatio || 1;

      canvas.width =
        Math.round(window.innerWidth * dpr);

      canvas.height =
        Math.round(window.innerHeight * dpr);

      canvas.style.width =
        `${window.innerWidth}px`;

      canvas.style.height =
        `${window.innerHeight}px`;

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );
    }


    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    // ============================================================
    // CAMERA
    // ============================================================

    async function openCamera() {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio: false,

          video: {
            facingMode: "user",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          }
        });


      video.srcObject = stream;


      await new Promise((resolve) => {

        if (
          video.readyState >= 1 &&
          video.videoWidth > 0
        ) {
          resolve();
          return;
        }

        video.addEventListener(
          "loadedmetadata",
          resolve,
          { once: true }
        );
      });


      await video.play();
    }


    // ============================================================
    // MEDIAPIPE
    // ============================================================

    async function createHandLandmarker() {

      const vision =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
        );


      return HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

            delegate: "GPU"
          },

          runningMode: "VIDEO",

          numHands: CONFIG.maxHands,

          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.5
        }
      );
    }


    // ============================================================
    // COORDONNEES ECRAN
    // ============================================================

    function landmarkToScreen(landmark) {

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;

      const videoW = video.videoWidth;
      const videoH = video.videoHeight;


      const coverScale =
        Math.max(
          screenW / videoW,
          screenH / videoH
        );


      const displayedW =
        videoW * coverScale;

      const displayedH =
        videoH * coverScale;


      const cropX =
        (screenW - displayedW) * 0.5;

      const cropY =
        (screenH - displayedH) * 0.5;


      let x = landmark.x;

      if (CONFIG.mirror) {
        x = 1 - x;
      }


      return {
        x:
          x * displayedW +
          cropX,

        y:
          landmark.y *
          displayedH +
          cropY
      };
    }


    // ============================================================
    // LISSAGE
    // ============================================================

    function smoothPoint(
      side,
      landmarkIndex,
      point
    ) {

      const store =
        smoothPoints[side];

      const previous =
        store.get(landmarkIndex);


      if (!previous) {

        const first = {
          ...point
        };

        store.set(
          landmarkIndex,
          first
        );

        return first;
      }


      const s =
        CONFIG.smoothing;


      const result = {
        x:
          previous.x +
          (
            point.x -
            previous.x
          ) * s,

        y:
          previous.y +
          (
            point.y -
            previous.y
          ) * s
      };


      store.set(
        landmarkIndex,
        result
      );


      return result;
    }


    // ============================================================
    // DESSIN
    // ============================================================

    function drawLine(a, b, color) {

      ctx.save();

      /*
        Halo coloré pour rendre les traits beaucoup
        plus visibles sur la vidéo.
      */
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;

      ctx.beginPath();

      ctx.moveTo(
        a.x,
        a.y
      );

      ctx.lineTo(
        b.x,
        b.y
      );

      ctx.strokeStyle = color;

      ctx.lineWidth =
        CONFIG.lineWidth;

      ctx.lineCap = "round";

      ctx.stroke();

      /*
        Deuxième passage plus net au centre.
      */
      ctx.shadowBlur = 6;
      ctx.lineWidth =
        CONFIG.lineWidth * 0.55;

      ctx.stroke();

      ctx.restore();
    }


    function drawPoint(point, color) {

      ctx.save();

      ctx.shadowColor = color;
      ctx.shadowBlur = 14;

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        CONFIG.pointRadius,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = color;
      ctx.fill();

      ctx.strokeStyle =
        "rgba(255,255,255,.95)";

      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();
    }


    function getTipPoint(
      side,
      landmarks,
      tipIndex
    ) {

      const raw =
        landmarkToScreen(
          landmarks[tipIndex]
        );

      return smoothPoint(
        side,
        tipIndex,
        raw
      );
    }


    function updateFingerConnections(
      leftHand,
      rightHand
    ) {

      const connections = {};


      for (
        const [fingerName, tipIndex]
        of Object.entries(TIPS)
      ) {

        connections[fingerName] = {

          leftPoint:
            getTipPoint(
              "Left",
              leftHand,
              tipIndex
            ),

          rightPoint:
            getTipPoint(
              "Right",
              rightHand,
              tipIndex
            ),

          color:
            COLORS[fingerName]
        };
      }


      lastConnections =
        connections;

      lastValidDetectionTime =
        performance.now();
    }


    function drawLastConnections() {

      if (!lastConnections) {
        return;
      }


      const elapsed =
        performance.now() -
        lastValidDetectionTime;


      /*
        Après un vrai long décrochage seulement,
        on fait disparaître les lignes.
      */
      if (
        elapsed >
        CONFIG.holdLastDetectionMs
      ) {
        lastConnections = null;
        return;
      }


      for (
        const connection
        of Object.values(
          lastConnections
        )
      ) {

        drawLine(
          connection.leftPoint,
          connection.rightPoint,
          connection.color
        );

        drawPoint(
          connection.leftPoint,
          connection.color
        );

        drawPoint(
          connection.rightPoint,
          connection.color
        );
      }
    }


    // ============================================================
    // LOOP
    // ============================================================

    function loop(timestamp) {

      ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
      );


      if (
        handLandmarker &&
        video.readyState >= 2
      ) {

        const interval =
          1000 /
          CONFIG.trackingFPS;


        if (
          video.currentTime !==
            lastVideoTime &&
          timestamp -
            lastTrackingTime >=
            interval
        ) {

          lastVideoTime =
            video.currentTime;

          lastTrackingTime =
            timestamp;


          const result =
            handLandmarker.detectForVideo(
              video,
              performance.now()
            );


          const hands =
            result.landmarks || [];

          const handedness =
            result.handedness || [];


          let leftHand = null;
          let rightHand = null;


          /*
            MediaPipe nous dit quelle main est gauche/droite.
          */
          for (
            let i = 0;
            i < hands.length;
            i++
          ) {

            const category =
              handedness[i]?.[0];

            const label =
              category?.categoryName;


            if (label === "Left") {

              leftHand =
                hands[i];

            } else if (
              label === "Right"
            ) {

              rightHand =
                hands[i];
            }
          }


          /*
            On ne dessine les connexions que si
            les deux mains sont détectées.
          */
          if (
            leftHand &&
            rightHand
          ) {

            updateFingerConnections(
              leftHand,
              rightHand
            );


            statusEl.textContent =
              "2 mains détectées • doigts reliés";

          } else {

            statusEl.textContent =
              `${hands.length}/2 main(s) détectée(s)`;
          }
        }
      }


      /*
        Important :
        on redessine les DERNIERES positions valides
        à chaque animation frame, même quand MediaPipe
        n'effectue pas de nouvelle inférence.
      */
      drawLastConnections();


      requestAnimationFrame(
        loop
      );
    }


    // ============================================================
    // START
    // ============================================================

    async function start() {

      if (started) {
        return;
      }


      started = true;

      startButton.style.display =
        "none";


      try {

        statusEl.textContent =
          "Ouverture caméra…";


        const landmarkerPromise =
          createHandLandmarker();


        await openCamera();


        statusEl.textContent =
          "Chargement du tracking…";


        handLandmarker =
          await landmarkerPromise;


        statusEl.textContent =
          "Montre tes deux mains";


        requestAnimationFrame(
          loop
        );


      } catch (error) {

        console.error(error);

        started = false;


        let message =
          error?.message ||
          String(error);


        if (!window.isSecureContext) {

          message =
            "La caméra nécessite HTTPS ou localhost.";
        }


        statusEl.textContent =
          "Erreur : " +
          message;


        startButton.style.display =
          "block";
      }
    }


    startButton.addEventListener(
      "click",
      start
    );


    start();

  </script>

</body>
</html>
